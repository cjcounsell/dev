#!/usr/bin/env bash

PROFILE_NAME="omarchy"
PROFILE_DESC="Arch desktop with Hyprland"

PROFILE_MODULES=(core shell cli-tools ssh neovim tmux node secrets desktop networkmanager)
PROFILE_DOTFILES=(common omarchy)

OPTIONAL_MODULES=(php dotnet)

omarchy_post_sync() {
    if command -v hyprctl >/dev/null 2>&1; then
        log_info "Reloading Hyprland"
        hyprctl keyword misc:disable_autoreload true 2>/dev/null || true
        hyprctl reload >/dev/null 2>&1 || log_warn "hyprctl reload failed"
        hyprctl keyword misc:disable_autoreload false 2>/dev/null || true
    fi
}
